# Pytest configuration for RoboCAD
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -m "not heavy and not mujoco and not benchmark and not slow"
    --timeout=120
    --tb=short
markers =
    slow: tests that take >10 s locally or involve multiple backend calls
    heavy: tests that load large meshes, run long rollouts, or stress geometry kernels
    mujoco: tests that require the optional mujoco>=3.0.0 dependency
    benchmark: prompt/model benchmarks that are slow and API-costly
    network: tests that call external APIs (Onshape, Anthropic, etc.)
