<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO-101 · RoboCAD Twin</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#11161f; --panel2:#0d1219; --line:#1e2633; --line2:#2b3646;
    /* --faint is the quietest text colour and still clears 4.5:1 on --panel (5.2:1); the values
       below it are bars and dots, which carry no text. --faint #5b6878 measured 3.2:1. */
    --ink:#e6ebf2; --dim:#8b97a8; --faint:#7d8a9b; --accent:#57d3a0; --warn:#f2b45c; --fail:#ef6b6b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --gap:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:12px/1.3 system-ui,-apple-system,Segoe UI,sans-serif}
  /* One screen. The grid owns every pixel: no page scroll, no scroll inside a card. */
  #app{display:grid;height:100vh;width:100vw;
    grid-template-columns:300px minmax(0,1fr) 340px;
    grid-template-rows:52px minmax(0,1fr) 58px;
    gap:var(--gap);padding:var(--gap)}
  header{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-width:0;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 12px}
  .product{display:flex;flex-direction:column;justify-content:center;min-width:0}
  .product b{font-size:13px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
  .product span{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #kpis{display:flex;gap:6px;margin-left:auto;min-width:0;overflow:hidden}
  .kpi{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:3px 8px;
    min-width:0;flex:none;display:flex;flex-direction:column;justify-content:center}
  /* 11 px is the floor for every piece of functional text on this page, including these labels: they
     are read off a projector, and 8 px caps at arm's length is not text, it is texture. */
  .kpi .k{font-size:11px;letter-spacing:.04em;color:var(--faint);text-transform:uppercase;white-space:nowrap}
  .kpi .v{font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .kpi .v em{font-style:normal;color:var(--dim);font-size:11px}
  /* The package tile carries a value AND a pill. As one ellipsised string the pill was clipped off
     the end at 150 px, so the tile that is supposed to say "tagged" said only a tag. The value line
     is a row here: the tag shrinks, the pill never does. */
  .kpi .v.pkgv{display:flex;align-items:center;gap:6px;max-width:230px}
  .kpi .v.pkgv .tagtext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .kpi .v.pkgv .pill{flex:none}
  .pill{display:inline-block;border-radius:10px;padding:0 6px;font-size:11px;line-height:16px;
    border:1px solid var(--line2);color:var(--dim);white-space:nowrap;font-family:var(--mono)}
  .pill.ok{border-color:#2f6a53;color:#bff3dc;background:#17241f}
  .pill.no{border-color:#6b2a2a;color:#f3b6b6;background:#241617}
  .pill.wa{border-color:#6b4a1c;color:#f8d7a5;background:#241d14}
  /* The columns fill their height instead of leaving a dead band under the last card. Rows grow to
     share the spare height and never shrink below their own content, and each card's body spreads
     its rows into that height, so the extra space reads as spacing inside a full panel rather than
     as a panel that stopped loading. */
  .col{display:grid;gap:var(--gap);min-height:0;min-width:0;align-content:stretch;
    grid-auto-rows:minmax(max-content,1fr)}
  #left,#right{grid-template-rows:none}
  /* Below 780 px of window there is no spare height for the two extra cards, so they are hidden
     rather than clipped: a card whose bottom row is cut off is worse than a shorter column. */
  @media (max-height: 779px){ #same-grp,#prov-grp{display:none} }
  /* The page is opened inside the HUD's blade, which is 68% of the window: on a 1280x720 projector
     that is an 870 px page, and the three-column grid handed the stage 198 px of width -- a viewer
     you cannot see. The rails shrink first, then the right rail goes: its four cards are counts and
     provenance that the header tiles and the drawers still carry. The stage is what the demo is. */
  @media (max-width: 1180px){
    #app{grid-template-columns:264px minmax(0,1fr) 300px}
    /* The last tile ended one letter short of PACKAGE at a blade width: letter-spacing on the label
       is what overflowed, so the tight header pays for it with the gaps and the padding instead. */
    #kpis{gap:4px}
    .kpi{padding:3px 6px}
  }
  @media (max-width: 1119px){
    #app{grid-template-columns:260px minmax(0,1fr)}
    #right{display:none}
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:6px 9px}
  /* the flash the voice leaves behind: a card it asked for says so */
  .nav-flash,.flash{outline:2px solid var(--accent);outline-offset:-1px;background:#12211d}
  .card h2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
    margin:0 0 5px;display:flex;align-items:center;gap:6px;min-width:0;flex:none}
  .card h2 .num{font-family:var(--mono);color:var(--faint);font-size:11px}
  .card h2 .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card h2 button.i{border:1px solid var(--line2);background:none;color:var(--faint);border-radius:50%;
    width:16px;height:16px;font-size:11px;line-height:1;cursor:pointer;padding:0;flex:none}
  .card h2 button.i:hover{color:var(--ink);border-color:var(--accent)}
  .card .body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px;
    justify-content:space-between}
  .row{display:flex;align-items:baseline;gap:6px;min-width:0;font-family:var(--mono);font-size:11px;
    line-height:15px}
  .row .l{flex:1;min-width:0;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .v{color:var(--ink);white-space:nowrap}
  .row .v.acc{color:var(--accent)}
  .cap{font-family:var(--mono);font-size:11px;line-height:15px;color:var(--faint);flex:none}
  .bar{height:3px;background:#1b2431;border-radius:2px;overflow:hidden;flex:none}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar.pub i{background:#6c7f93}
  .mline{display:flex;flex-direction:column;gap:1px;flex:none}
  .minis{display:flex;gap:2px;align-items:flex-end;height:24px;margin-top:2px}
  .minis div{flex:1;background:#243040;border-radius:1px 1px 0 0;min-height:2px}
  .minis div.hi{background:#57d3a0}
  /* Every bar and every curve on the page carries a name in the open. A colour a reader has to
     infer from a drawer is a colour that means nothing on the projector. */
  .legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--mono);
    font-size:11px;line-height:15px;color:var(--faint);flex:none}
  .legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:1px;background:#6c7f93;flex:none}
  .legend i.acc{background:var(--accent)} .legend i.solid{background:#6c7f93}
  .legend i.dash{height:0;background:none;border-top:1px dashed #6b4a1c}
  .checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;align-content:start;flex:1}
  /* The toggles and the check rows are lists, so spare height goes between the rows of the list
     rather than into a gap under it. */
  #togs,#checks{align-content:space-between}
  #togs{flex:1}
  .crow{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;line-height:15px;
    min-width:0;cursor:pointer;background:none;border:0;color:var(--ink);padding:0;text-align:left}
  .crow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.pass{background:var(--accent)} .dot.fail{background:var(--fail)}
  .dot.skipped{background:var(--faint)} .dot.warn{background:var(--warn)}
  .st{font-weight:600;font-size:11px;letter-spacing:.02em}
  .st-pass{color:var(--accent)} .st-fail{color:var(--fail)}
  .st-skipped,.st-skip{color:var(--dim)} .st-warn{color:var(--warn)}
  .chiplist{display:flex;flex-direction:column;gap:1px;min-height:0}
  .chip{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;line-height:15px;
    min-width:0;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;text-align:left}
  .chip .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  .chip .m{color:var(--ink);white-space:nowrap}
  .chip.on .n{color:var(--accent)}
  .togs{display:grid;grid-template-columns:1fr 1fr;gap:3px}
  .tog{border:1px solid var(--line);border-radius:4px;background:#151b24;color:var(--dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.02em;padding:4px 4px;cursor:pointer;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tog[aria-pressed="true"]{background:#1f3a2f;border-color:#2f6a53;color:#bff3dc}
  .rungs{display:flex;gap:3px;flex:none}
  .rung{flex:1;text-align:center;font-family:var(--mono);font-size:11px;line-height:16px;border-radius:3px;
    border:1px solid var(--line2);color:var(--dim);padding:0;cursor:pointer;background:none}
  .rung.ok{border-color:#2f6a53;color:#bff3dc}
  .rung.no{border-color:#6b2a2a;color:#f3b6b6}
  .mono{font-family:var(--mono);font-size:11px;line-height:14px;color:var(--dim);overflow:hidden;
    flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mono b{color:var(--ink);font-weight:500}
  /* the 3D stage */
  #stage{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:#0a0d12}
  #stage canvas{display:block;width:100%;height:100%}
  #rings{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
  #leader{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;overflow:visible}
  #hud{position:absolute;left:10px;top:8px;font-family:var(--mono);font-size:11px;color:var(--dim);
    display:flex;gap:8px;align-items:center}
  #hud .mode{border:1px solid var(--line2);border-radius:3px;padding:1px 5px;color:#9fd8c6;letter-spacing:.05em}
  #callout{position:absolute;left:0;top:0;transform:translate(0,-100%);pointer-events:none;
    font-family:var(--mono);font-size:11px;line-height:1.3;color:var(--ink);
    background:rgba(13,18,25,.9);border:1px solid #6b2a2a;border-radius:5px;padding:2px 6px;white-space:nowrap}
  #callout b{color:#ffb4b4;font-weight:600}
  #load{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);
    font-family:var(--mono);font-size:11px;background:var(--bg)}
  /* timeline */
  footer{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-width:0;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 12px}
  footer .ctl{border:1px solid var(--line2);background:#151b24;color:var(--ink);border-radius:5px;
    font-family:var(--mono);font-size:11px;padding:4px 9px;cursor:pointer}
  #scrub{position:relative;flex:1;min-width:60px;height:20px;display:flex;align-items:center}
  #scrubber{width:100%;accent-color:var(--accent);height:14px;margin:0}
  #marker{position:absolute;right:0;top:2px;bottom:2px;width:1px;background:var(--warn);pointer-events:none}
  #clock{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
  #clock b{color:var(--ink);font-weight:500}
  #revswitch{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  #revswitch button{border:1px solid var(--line2);background:#151b24;color:var(--dim);border-radius:4px;
    font-family:var(--mono);font-size:11px;padding:2px 6px;cursor:pointer}
  #revswitch button[aria-pressed="true"]{background:#1f3a2f;border-color:#2f6a53;color:#bff3dc}
  #revdelta{color:var(--warn);white-space:nowrap}
  /* drawer */
  #drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,42vw);background:#0e141c;
    border-left:1px solid var(--line2);box-shadow:-14px 0 34px rgba(0,0,0,.45);
    transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;
    z-index:20;padding:12px 14px}
  #drawer.open{transform:translateX(0)}
  #drawer h3{margin:0 0 2px;font-size:13px;letter-spacing:.02em}
  #drawer .sub{font-size:11px;color:var(--faint);font-family:var(--mono);margin-bottom:10px}
  #dbody{flex:1;min-height:0;overflow:auto;font-size:13px;line-height:1.5;color:#cfd8e3}
  #dbody p{margin:0 0 8px}
  #dbody .kv{font-family:var(--mono);font-size:11px;color:var(--dim);margin:0 0 6px}
  #dbody .kv b{color:var(--ink);font-weight:500}
  #dclose{position:absolute;top:10px;right:12px;border:1px solid var(--line2);background:none;color:var(--dim);
    border-radius:4px;font-family:var(--mono);font-size:11px;padding:2px 7px;cursor:pointer}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
    transition:opacity .22s;z-index:19}
  #scrim.on{opacity:1;pointer-events:auto}
  @media (prefers-reduced-motion: reduce){#drawer,#scrim{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="product">
      <b>SO-101 · RoboCAD Twin</b>
      <span id="subline">compiled from STEP</span>
    </div>
    <div id="kpis"></div>
  </header>

  <div class="col" id="left">
    <section class="card" id="masses">
      <h2><span class="num">01</span><span class="grow">Mass</span>
        <span class="pill" id="m-mass-kind">modelled</span>
        <button class="i" data-drawer="masses" title="detail">i</button></h2>
      <div class="body" id="cmp"></div>
    </section>
    <section class="card" id="torque-grp">
      <h2><span class="num">02</span><span class="grow">Torque</span>
        <span class="pill" id="t-badge">static poses</span>
        <button class="i" data-drawer="torque" title="detail">i</button></h2>
      <div class="body" id="torque-body">
        <canvas id="torque-chart" width="272" height="44"></canvas>
        <div id="t-static"></div>
      </div>
    </section>
    <section class="card" id="joints">
      <h2><span class="num">03</span><span class="grow">Joints</span>
        <span class="mono" id="j-src">live</span>
        <button class="i" data-drawer="joints" title="detail">i</button></h2>
      <div class="body" id="joint-body"></div>
    </section>
    <section class="card" id="prov-grp">
      <h2><span class="num">04</span><span class="grow">Provenance</span>
        <button class="i" data-drawer="prov" title="detail">i</button></h2>
      <div class="body" id="prov-body"></div>
    </section>
  </div>

  <div id="stage">
    <svg id="rings" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <circle cx="50" cy="64" r="30" fill="none" stroke="#1b2735" stroke-width="0.14"/>
      <circle cx="50" cy="64" r="22" fill="none" stroke="#203044" stroke-width="0.12"/>
      <circle cx="50" cy="64" r="14" fill="none" stroke="#1b2735" stroke-width="0.1" stroke-dasharray="1.2 1.6"/>
    </svg>
    <svg id="leader" aria-hidden="true"><line id="leaderline" x1="0" y1="0" x2="0" y2="0"
      stroke="#8a4a4a" stroke-width="1" stroke-dasharray="3 3"/>
      <circle id="contactdot" cx="0" cy="0" r="2.6" fill="#ff8a8a"/></svg>
    <div id="hud"><span class="mode" id="mode">REPLAY · REST POSE</span><span id="hud-t"></span></div>
    <div id="callout"></div>
    <div id="load">loading baked trajectory…</div>
  </div>

  <div class="col" id="right">
    <section class="card" id="checks-grp">
      <h2><span class="num">05</span><span class="grow">Checks</span>
        <span class="mono" id="c-count">–</span>
        <button class="i" data-drawer="checks" title="detail">i</button></h2>
      <div class="body"><div class="checkgrid" id="checks"></div></div>
    </section>
    <section class="card" id="links">
      <h2><span class="num">06</span><span class="grow">Links</span>
        <button class="i" data-drawer="links" title="detail">i</button></h2>
      <div class="body"><div class="chiplist" id="link-list"></div></div>
    </section>
    <section class="card" id="display">
      <h2><span class="num">07</span><span class="grow">Display</span>
        <button class="i" data-drawer="display" title="detail">i</button></h2>
      <div class="body"><div class="togs" id="togs"></div></div>
    </section>
    <section class="card" id="twin-grp">
      <h2><span class="num">08</span><span class="grow">Twin calibration</span>
        <span class="pill wa">SYNTHETIC</span>
        <button class="i" data-drawer="twin" title="detail">i</button></h2>
      <div class="body">
        <div class="rungs" id="rungs"></div>
        <div class="mono" id="twin-line"></div>
        <div class="mono" id="twin-snr"></div>
      </div>
    </section>
    <section class="card" id="same-grp">
      <h2><span class="num">09</span><span class="grow">Same robot</span>
        <span class="pill" id="same-pill">matched</span>
        <button class="i" data-drawer="same" title="detail">i</button></h2>
      <div class="body" id="same-body"></div>
    </section>
  </div>

  <footer id="timeline">
    <button class="ctl" id="b-play" aria-pressed="true">pause</button>
    <div id="scrub">
      <input id="scrubber" type="range" min="0" max="599" step="1" value="0" aria-label="replay frame">
      <div id="marker" title="worst pose-gate sample: 70.69 mm"></div>
    </div>
    <div id="clock"></div>
    <div id="revswitch">
      <span>infill</span>
      <button id="rev-before" aria-pressed="true">0.20</button>
      <button id="rev-after" aria-pressed="false">0.30</button>
      <span id="revdelta"></span>
    </div>
  </footer>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <button id="dclose" title="close (Esc)">esc</button>
  <h3 id="dtitle">Detail</h3>
  <div class="sub" id="dsub"></div>
  <div id="dbody"></div>
</aside>

<script src="trajectory.js"></script>
<script src="meshes.js"></script>
<script src="three.min.js"></script>
<script src="twin.js"></script>
<script src="identification.js"></script>
<script src="report.js"></script>
<script src="summary.js"></script>
<script src="manifest.js"></script>
<script src="torque.js"></script>
<script src="diff.js"></script>
<script src="sections.js"></script>
<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------------------------------
  // One adapter. Every card reads this object and nothing else, so a figure is defined once and a
  // card cannot quietly disagree with the voice, which reads the same summary.
  // ---------------------------------------------------------------------------------------------
  var S = window.SO101_SUMMARY || {};
  var R = window.SO101_REPORT || {};
  var T = window.SO101_TORQUE || {};
  var M = window.SO101_MANIFEST || {};
  var D = window.SO101_IDENT || {};
  var V = window.SO101_REVISION || {};
  var META = window.SO101_META || {};
  var TRAJ = window.SO101_TRAJ || {};
  var MESHES = window.SO101_MESHES || [];

  function num(node){ return (node && typeof node === "object" && node.value != null) ? node.value
                           : (typeof node === "number" ? node : null); }
  function kind(node){ return (node && typeof node === "object" && node.kind) ? node.kind : null; }
  function fixed(v, d){ return (v == null || isNaN(v)) ? "not in the bundle" : Number(v).toFixed(d); }

  var CAL = S.calibration || {}, MASS = S.masses || {}, TQ = S.torque || {},
      RES = S.residuals || {}, REV = S.revision || {}, PREV = CAL.twin_preview || {};

  var statusQuoScenario = (CAL.scenarios || []).filter(function(s){
    return /12-bit encoder, 62 Hz/i.test(String(s.scenario || "")); })[0] || null;
  var currentScenario = (CAL.scenarios || []).filter(function(s){
    return /torque or current logged, 1 percent/i.test(String(s.scenario || "")); })[0] || null;

  // One signal-to-noise number on this page. The identifiability JSON, identifiability.md and this
  // card all use the summary's position_only block, computed at the document's reference joint speed.
  // Before this, one note divided by a single log's peak speed and printed 0.04 beside the table's
  // 0.10, and both were "right" for their own log; the ratio is speed dependent, so it is quoted once.
  var SNR = {
    value: num(CAL.position_only ? CAL.position_only.snr : null),
    scenario: (CAL.position_only || {}).scenario || (statusQuoScenario || {}).scenario || "",
    label: "friction torque at reference speed ÷ torque of one encoder count"
  };

  var currentParams = (CAL.current_channel || {}).params || [];
  var coulomb = currentParams.filter(function(p){
    return p.name === "coulomb_friction" && /shoulder/i.test(p.joint); })[0]
    || currentParams.filter(function(p){ return p.name === "coulomb_friction"; })[0] || null;

  var selfCollision = (S.checks || []).filter(function(c){ return c.id === "self_collision"; })[0] || null;
  var scMeasured = (selfCollision && selfCollision.measured) || {};

  var DATA = {
    name: M.name || "so101",

  // ---- 01 mass: the comparison the voice calls "comparison" -----------------------------------
  // The infill switch is the one control on this page that changes numbers, so it owns them all:
  // every dependent value is written from setInfill below, and nothing keeps a copy of the value it
  // was built with. The defect this replaces: the switch moved the print mass and left the row
  // label reading "0.20 infill", the delta and the saving rows at 0.20, and the torque card
  // untouched -- four numbers on one screen that disagreed about which bake they described.
  var printRefs = null;
  // The print model is linear in infill fraction: wall volume does not move when the interior does.
  // Two compiled bakes (0.20 and 0.30) therefore determine every other value exactly, and the two
  // compiled endpoints are used as they are rather than re-derived through the line.
  function massAtInfill(f){
    var r = DATA.revision;
    if (f == null || r.massBefore == null || r.massAfter == null) return null;
    if (r.before != null && f === r.before) return r.massBefore;
    if (r.after != null && f === r.after) return r.massAfter;
    if (r.before == null || r.after == null || r.after === r.before) return null;
    return r.massBefore + (f - r.before) * (r.massAfter - r.massBefore) / (r.after - r.before);
  }
  (function massCard(){
    var box = el("cmp");
    var solid = DATA.masses.solid, print = DATA.masses.print, pub = DATA.masses.published;
    var top = Math.max(solid || 0, print || 0, pub || 0) || 1;
    // The bar takes the number, not the formatted string: passing "1.332 kg" here produced a NaN
    // width, which the browser drops, so every bar drew full width and the three masses looked equal.
    function line(label, valueKg, text, cls){
      var wrap = mk("div","mline");
      var r = row(label, text, cls);
      wrap.appendChild(r);
      wrap.appendChild(bar((valueKg == null ? 0 : valueKg) / top, cls !== "acc"));
      box.appendChild(wrap);
      return { wrap: wrap, row: r, label: r.querySelector(".l"), value: r.querySelector(".v"),
               fill: wrap.querySelector(".bar i") };
    }
    line("solid · CAD volume × density", solid, fixed(solid, 3) + " kg");
    var printLine = line("print · " + fixed(DATA.masses.wall, 2) + " mm wall, " +
                         fixed(DATA.masses.infill, 2) + " infill", print, fixed(print, 3) + " kg", "acc");
    line("published model (stated)", pub, fixed(pub, 3) + " kg");
    box.appendChild(legend([["acc","printed, this infill"],["solid","solid and published"]]));

    box.appendChild(minis);
    box.appendChild(mk("div","mono", bodies.length + " links · assumed density flagged in detail"));

    printRefs.pub = pub; printRefs.solid = solid;

  (function torqueCard(){
    var c = el("torque-chart"), ctx = c.getContext("2d");
    var w = c.width, h = c.height, pad = 3;

    // The chart draws three strokes; each one is named under it, in its own colour.
    el("torque-body").insertBefore(
      legend([["acc","compiled"],["solid","published"],["dash","±rated"]]),
      el("t-static"));
    var cap = mk("div","cap");
    cap.textContent = "compiled / published · N·m";
    statics.appendChild(cap);
    var poseRows = DATA.torque.poses.map(function(p){
      var r = row(p.pose, fixed(p.compiled, 3) + " / " + fixed(p.published, 3));
      statics.appendChild(r);
      return { pose: p, value: r.querySelector(".v") };
    });
    statics.appendChild(row("stall / rated (datasheet)",
      fixed(DATA.torque.stall, 2) + " / " + fixed(DATA.torque.rated, 2) + " N·m"));
    var gateRow = null;
    if (DATA.torque.poseGate != null) {
      gateRow = row("moving-arm gate", fixed(DATA.torque.poseGate, 2) + " mm");
      statics.appendChild(gateRow);
    }
    var effortRow = row("revision bake at 0.30", "");
    effortRow.style.display = "none";
    statics.appendChild(effortRow);

    function draw(scale){
      var off = ((T.official || []).map(function(f){ return f[joint]; })),
          comp = ((T.compiled || []).map(function(f){ return f[joint] * scale; }));
      if (!off.length || !comp.length) return;
      var all = off.concat(comp);
      var lo = Math.min.apply(null, all.concat(rated == null ? [] : [-rated])),
          hi = Math.max.apply(null, all.concat(rated == null ? [] : [rated]));
      var y = function(v){ return h - pad - (h - 2*pad) * ((v - lo) / ((hi - lo) || 1)); };
      var x = function(i){ return pad + (w - 2*pad) * i / Math.max(1, off.length - 1); };
      ctx.clearRect(0,0,w,h);
      if (rated != null) {
        ctx.strokeStyle = "#6b4a1c"; ctx.setLineDash([3,3]); ctx.lineWidth = 1;
        [rated, -rated].forEach(function(v){ ctx.beginPath(); ctx.moveTo(pad,y(v));
          ctx.lineTo(w-pad,y(v)); ctx.stroke(); });
        ctx.setLineDash([]);
      }
      ctx.strokeStyle = "#6c7f93"; ctx.lineWidth = 1.1; ctx.beginPath();
      off.forEach(function(v,i){ i ? ctx.lineTo(x(i),y(v)) : ctx.moveTo(x(i),y(v)); }); ctx.stroke();
      ctx.strokeStyle = "#57d3a0"; ctx.lineWidth = 1.4; ctx.beginPath();
      comp.forEach(function(v,i){ i ? ctx.lineTo(x(i),y(v)) : ctx.moveTo(x(i),y(v)); }); ctx.stroke();
    }
    draw(1);

  function b64ToBytes(b64){ var bin = atob(b64), out = new Uint8Array(bin.length);

  var f32 = function(b64){ return new Float32Array(b64ToBytes(b64)); };
  var u32 = function(b64){ return new Uint32Array(b64ToBytes(b64)); };

  var qpos = f32(TRAJ.qpos), bodyPos = f32(TRAJ.body_pos), bodyMat = f32(TRAJ.body_mat);

  scene.add(new THREE.HemisphereLight(0xdff0ff, 0x22303d, 1.15));

  var rim = new THREE.DirectionalLight(0x7fb6ff, 0.7); rim.position.set(-0.7,0.4,-0.6); scene.add(rim);
  var grid = new THREE.GridHelper(1.2, 24, 0x24303f, 0x18212c);

      metalness: 0.15, roughness: 0.55, side: THREE.DoubleSide }));

        bodyMat[mbase+b*9+3], bodyMat[mbase+b*9+4], bodyMat[mbase+b*9+5], bodyPos[base+b*3+1],
        bodyMat[mbase+b*9+6], bodyMat[mbase+b*9+7], bodyMat[mbase+b*9+8], bodyPos[base+b*3+2],
        0,0,0,1);

    el("hud-t").textContent = "t " + (f/(META.hz || 100)).toFixed(2) + " s · frame " + f + "/" + frames;
    el("clock").textContent = "";
    el("clock").appendChild(mk("b", null, (f/(META.hz || 100)).toFixed(2) + " s"));
    el("clock").appendChild(document.createTextNode(" · frame " + f + "/" + frames));

  var az = 0.9, po = 0.35, dist = 0.75, target = new THREE.Vector3(0, 0.16, 0);

    lx = e.clientX; ly = e.clientY; placeCamera();

  renderer.domElement.addEventListener("wheel", function(e){
    e.preventDefault(); state.turntable = false; syncToggles();

  }, { passive: false });

  function syncToggles(){
    var box = el("togs");

  }

  // self-collision: the pair the checks found, tinted rather than described. Names come from the
  // report, so a bundle whose overlap is elsewhere tints that pair instead.
  var flagged = [];
  DATA.selfCollision.pairs.forEach(function(pair){
    pair.forEach(function(name){
      for (var i=1;i<BODIES.length;i++){
        if (String(BODIES[i].name).toLowerCase() === String(name).toLowerCase() && flagged.indexOf(i) < 0) {
          flagged.push(i);
        }
      }
    });
  });
  function applyState(){
    comDots.forEach(function(d){ d.visible = state.com; });
    bodyGroups.forEach(function(g, i){
      var on = state.collision && flagged.indexOf(i) >= 0;
      g.traverse(function(o){
        if (o.isMesh && o.material && o.material.emissive) {
          o.material.emissive.setHex(on ? 0x5a1f1f : 0x000000);
        }
      });
      g.visible = (isolateBody == null) || (i === isolateBody);
    });
    callout.style.display = (state.labels && DATA.selfCollision.deepestMm != null) ? "" : "none";
    leader.style.display = callout.style.display;
  }

  var explosion = new Map();
  function updateExplosion(){
    for (var b=1;b<nbody;b++){
      var parent = (BODIES[b] || {}).parent;
      if (parent == null) continue;
      var bp = frame*nbody*3;
      var dx = bodyPos[bp+b*3] - bodyPos[bp+parent*3];
      var dy = bodyPos[bp+b*3+1] - bodyPos[bp+parent*3+1];
      var dz = bodyPos[bp+b*3+2] - bodyPos[bp+parent*3+2];
      var len = Math.hypot(dx,dy,dz) || 1;
      explosion.set(b, [dx/len*0.04, dy/len*0.04, dz/len*0.04]);
    }
  }
  var offMatrix = new THREE.Matrix4();
  function applyExplosion(){
    for (var b=1;b<nbody;b++){
      var o = explosion.get(b); if (!o) continue;
      offMatrix.makeTranslation(o[0], o[1], o[2]);
      bodyGroups[b].matrix.premultiply(offMatrix);
      bodyGroups[b].matrixWorldNeedsUpdate = true;
    }
  }
  function isolate(idx){
    isolateBody = (isolateBody === idx) ? null : idx;
    applyState();
    linkChips.forEach(function(c, i){ c.classList.toggle("on", isolateBody === i); });
  }

  function resize(){
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();

    // cropping it: the fit below is a property of the stage, not of the first window size.
    if (modelBox) fitHero();
  }
  addEventListener("resize", resize);

  // Fit the robot to the stage by measurement, not by a guessed multiple of its size.
  // The old camera distance was ``size.length() * 1.20``, which is a diagonal, and on a 3/4 view of
  // a long thin arm that number is too close: the wrist left the top of the frame. This projects the
  // model's eight bounding-box corners and moves the camera until the furthest corner sits at 80% of
  // the half-frame, so nothing is cropped at any aspect and the robot is as large as that allows.
  var modelBox = null;
  function boxCorners(box){
    var pts = [], i;
    for (i=0;i<8;i++){
      pts.push(new THREE.Vector3(i&1?box.max.x:box.min.x, i&2?box.max.y:box.min.y,
                                 i&4?box.max.z:box.min.z));
    }
    return pts;
  }
  function projectBox(box){
    var maxAbs = 0, minY = 1e9, maxY = -1e9;

      var v = p.clone().project(camera);
      var a = Math.max(Math.abs(v.x), Math.abs(v.y));
      if (a > maxAbs) maxAbs = a;
      if (v.y < minY) minY = v.y;
      if (v.y > maxY) maxY = v.y;
    });
    return { maxAbs: maxAbs, heightFraction: (maxY - minY) / 2 };
  }
  function fitHero(){
    if (!modelBox || modelBox.isEmpty()) return;

      placeCamera(); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      var r = projectBox(modelBox);
      if (!isFinite(r.maxAbs) || r.maxAbs <= 0) break;
      dist = Math.max(0.12, Math.min(3.0, dist * (r.maxAbs / 0.80)));
    }
    placeCamera(); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    var fit = projectBox(modelBox);
    window.__heroFit = fit;
  }

  // opening pose: the frame whose body origins span the largest box, the most readable shape
  (function pickReadableFrame(){
    var best = frame, bestSpan = -1, step = Math.max(1, Math.round(frames/150));
    for (var f=0; f<frames; f+=step){
      var base = f*nbody*3;
      var mnx=1e9,mny=1e9,mnz=1e9,mxx=-1e9,mxy=-1e9,mxz=-1e9;
      for (var b=0;b<nbody;b++){
        var x=bodyPos[base+b*3], y=bodyPos[base+b*3+1], z=bodyPos[base+b*3+2];
        if (x<mnx) mnx=x; if (x>mxx) mxx=x;
        if (y<mny) mny=y; if (y>mxy) mxy=y;
        if (z<mnz) mnz=z; if (z>mxz) mxz=z;
      }
      var span = Math.hypot(mxx-mnx, mxy-mny, mxz-mnz);
      if (span > bestSpan){ bestSpan = span; best = f; }
    }
    frame = best;
  })();
  applyFrame(frame);
  (function frameModel(){
    var box = new THREE.Box3();
    bodyGroups.forEach(function(g){ g.updateMatrixWorld(true); box.expandByObject(g); });
    if (!box.isEmpty()){
      box.getCenter(target);
      var size = box.getSize(new THREE.Vector3());
      // A starting distance; fitHero below measures the projection and corrects it.
      dist = Math.max(0.25, size.length()*1.60);
      grid.position.y = box.min.y - size.y*0.02;
      grid.scale.setScalar(Math.max(0.5, Math.max(size.x, size.z)/1.2));
      az = Math.atan2(size.z, size.x) + Math.PI*0.25;
      po = 0.30;
      modelBox = box.clone();
      fitHero();
    }
  })();
  placeCamera(); resize();
  var loadEl = el("load"); if (loadEl && loadEl.parentNode) loadEl.parentNode.removeChild(loadEl);

  // callout: anchored on the first body of the overlapping pair, projected each frame
  var callout = el("callout"), leader = el("leaderline");
  (function fillCallout(){
    callout.textContent = "";
    if (DATA.selfCollision.deepestMm == null) return;
    callout.appendChild(mk("b", null, "self-collision"));
    callout.appendChild(document.createTextNode(
      " · hulls " + DATA.selfCollision.deepestMm.toFixed(1) + " mm"));
    if (DATA.selfCollision.solidMm3 != null) {
      callout.appendChild(document.createTextNode(
        " · solids touch " + DATA.selfCollision.solidMm3.toFixed(2) + " mm³"));
    }
  })();
  // The callout is anchored to the contact it names, not floated over the stage. It used to sit on
  // the wrist's origin, which for a wrist and a jaw a few millimetres apart reads as a label about
  // the arm rather than about the pair. The anchor here is the midpoint of the closest pair of the
  // two bodies' rendered vertices: that is where the drawn parts meet. The label's numbers stay the
  // check's own measurements (hull depth, B-rep intersection), because the sampled surface is not
  // the CAD solid and this page does not pretend one number is the other.
  var contactDot = el("contactdot");
  var pairIdx = (function(){
    var names = DATA.selfCollision.pairs[0] || [], out = [];
    names.forEach(function(name){
      for (var i=1;i<BODIES.length;i++){
        if (String(BODIES[i].name).toLowerCase() === String(name).toLowerCase()){ out.push(i); break; }
      }
    });
    return out.length === 2 ? out : null;
  })();
  var SAMPLE_MAX = 96, localSamples = [null, null];
  (function samplePair(){
    if (!pairIdx) return;
    pairIdx.forEach(function(idx, k){
      var group = bodyGroups[idx], total = 0, pts = [];
      if (!group) return;
      group.children.forEach(function(mesh){
        var pos = mesh.geometry && mesh.geometry.getAttribute("position");
        if (pos) total += pos.count;
      });
      if (!total) return;
      var stride = Math.max(1, Math.floor(total / SAMPLE_MAX));
      group.children.forEach(function(mesh){
        var pos = mesh.geometry && mesh.geometry.getAttribute("position");
        if (!pos) return;
        mesh.updateMatrix();
        for (var i=0;i<pos.count;i+=stride){
          var v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(mesh.matrix);
          pts.push(v.x, v.y, v.z);
        }
      });

    });
  })();
  var worldSamples = [new Float32Array(0), new Float32Array(0)];
  if (localSamples[0]) worldSamples[0] = new Float32Array(localSamples[0].length);
  if (localSamples[1]) worldSamples[1] = new Float32Array(localSamples[1].length);
  var contactPoint = new THREE.Vector3();
  function projectContact(){
    if (!pairIdx || !localSamples[0] || !localSamples[1]) return false;
    for (var k=0;k<2;k++){
      var src = localSamples[k], dst = worldSamples[k];
      var m = bodyGroups[pairIdx[k]].matrix.elements;
      for (var i=0;i<src.length;i+=3){
        var x = src[i], y = src[i+1], z = src[i+2];
        dst[i]   = m[0]*x + m[4]*y + m[8]*z  + m[12];
        dst[i+1] = m[1]*x + m[5]*y + m[9]*z  + m[13];
        dst[i+2] = m[2]*x + m[6]*y + m[10]*z + m[14];
      }
    }
    var a = worldSamples[0], b = worldSamples[1], best = Infinity, bx = 0, by = 0, bz = 0;
    for (var p=0;p<a.length;p+=3){

      for (var q=0;q<b.length;q+=3){
        var dx = ax-b[q], dy = ay-b[q+1], dz = az-b[q+2];
        var d2 = dx*dx + dy*dy + dz*dz;
        if (d2 < best){

  var projV = new THREE.Vector3();
  window.__callout = { visible: false };
  function showCallout(on){
    callout.style.display = on ? "" : "none";
    leader.style.display = on ? "" : "none";
    contactDot.style.display = on ? "" : "none";
    window.__callout.visible = on;
  }
  function positionCallout(){
    // LABELS is the presenter's switch; off-screen is the geometry's. Either one hides the label
    // and its leader, so a camera orbit can never leave a line pointing at nothing.
    var want = state.labels && DATA.selfCollision.deepestMm != null;
    if (!want || !projectContact()){ showCallout(false); return; }
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h){ showCallout(false); return; }
    camera.updateMatrixWorld();
    projV.copy(contactPoint).project(camera);
    if (!(projV.z < 1) || Math.abs(projV.x) > 1 || Math.abs(projV.y) > 1){
      showCallout(false); return;
    }
    var px = (projV.x*0.5 + 0.5) * w, py = (-projV.y*0.5 + 0.5) * h;
    var below = py < 96, right = px < w * 0.62;
    function place(onRight){
      callout.style.transform = below
        ? (onRight ? "translate(0,0)" : "translate(-100%,0)")
        : (onRight ? "translate(0,-100%)" : "translate(-100%,-100%)");
      callout.style.left = (px + (onRight ? 16 : -16)) + "px";
      callout.style.top = (below ? py + 12 : py - 12) + "px";
      showCallout(true);
      return callout.getBoundingClientRect();
    }
    var cr = place(right), sr = stage.getBoundingClientRect();
    // A label wider than the room on its side is clipped by the stage, which at a blade width is
    // the common case: flip to the other side and, if that still overflows, pin it inside the stage
    // and let the leader carry the distance. The label never leaves the frame.
    if (right && cr.right > sr.right){ right = false; cr = place(right); }
    if (!right && cr.left < sr.left){ right = true; cr = place(right); }
    if (cr.right > sr.right){
      callout.style.left = (parseFloat(callout.style.left) - (cr.right - sr.right) - 6) + "px";
      cr = callout.getBoundingClientRect();
    }
    if (cr.left < sr.left){
      callout.style.left = (parseFloat(callout.style.left) + (sr.left - cr.left) + 6) + "px";
      cr = callout.getBoundingClientRect();
    }
    var edgeX = (right ? cr.left : cr.right) - sr.left;
    var edgeY = (below ? cr.top : cr.bottom) - sr.top;
    leader.setAttribute("x1", px.toFixed(1)); leader.setAttribute("y1", py.toFixed(1));
    leader.setAttribute("x2", edgeX.toFixed(1)); leader.setAttribute("y2", edgeY.toFixed(1));
    contactDot.setAttribute("cx", px.toFixed(1)); contactDot.setAttribute("cy", py.toFixed(1));
    window.__callout = {
      visible: true,
      anchor: {x: px, y: py},
      world: [contactPoint.x, contactPoint.y, contactPoint.z],
      pair: DATA.selfCollision.pairs[0] || [],
      leader: {x1: px, y1: py, x2: edgeX, y2: edgeY},
      callout: {left: cr.left - sr.left, top: cr.top - sr.top,

  var playing = true, tPrev = performance.now();

  });

  });

  function loop(now){
    requestAnimationFrame(loop);
    var dt = (now - tPrev)/1000; tPrev = now;
    if (state.turntable && !drag){ az += 0.12 * Math.min(dt, 0.1); placeCamera(); }
    if (playing){
      frame = (frame + Math.round(dt*(META.hz||100))) % frames;
      applyFrame(frame);
      if (state.exploded) { updateExplosion(); applyExplosion(); }

  resize();

  // ---------------------------------------------------------------------------------------------
  // infill switch: one state, and every number on the page is written from it
  // ---------------------------------------------------------------------------------------------
  // The switch used to move the print mass and leave the row label, the delta, the saving and the
  // whole torque card describing the other bake. A page whose numbers disagree about which bake they
  // came from is worse than a page with no switch, so this function is now the only writer of
  // anything that depends on the infill fraction.
  var revBefore = el("rev-before"), revAfter = el("rev-after");
  function setInfill(f){
    var r = DATA.revision;
    var mass = massAtInfill(f);
    var atCompiled = mass != null && ((f === r.before) || (f === r.after));
    revBefore.setAttribute("aria-pressed", String(r.before != null && f === r.before));
    revAfter.setAttribute("aria-pressed", String(r.after != null && f === r.after));
    if (mass == null) {
      // Endpoints missing: say so on the control rather than leaving the last bake's numbers up.
      el("revdelta").textContent = "no second bake";
      return;
    }
    var refs = printRefs;
    refs.print.label.textContent = "print · " + fixed(DATA.masses.wall, 2) + " mm wall, " +
      fixed(f, 2) + " infill";
    refs.print.value.textContent = fixed(mass, 3) + " kg";
    var top = Math.max(refs.solid || 0, mass, refs.pub || 0) || 1;
    refs.print.fill.style.width = (100*(mass/top)).toFixed(1) + "%";
    refs.delta.textContent = "+" + fixed(100*((mass/(refs.pub || 1)) - 1), 1) + " %";
    refs.save.textContent = fixed(100*((refs.solid - mass)/(refs.solid || 1)), 0) + " % of solid";
    refs.basis.textContent = atCompiled
      ? "compiled at this infill"
      : "linear between the compiled bakes at " + fixed(r.before, 2) + " and " + fixed(r.after, 2) +
        " · the wall does not move with infill, so this line is the model, not a re-bake";
    el("revdelta").textContent = (r.after != null && f === r.after && r.deltaPercent != null)
      ? "+" + fixed(r.deltaPercent, 1) + " % printed" : "";
    var tile = el("kpi-mass");
    if (tile) {
      var v = tile.querySelector(".v");
      if (v) {
        v.textContent = fixed(mass, 3) + " kg";
        v.appendChild(mk("em", null,
          (r.after != null && f === r.after && r.deltaPercent != null)
            ? " +" + fixed(r.deltaPercent, 1) + "%" : " modelled"));
      }
    }
    // Torque: the print model holds every part's centre of mass, so a gravity torque scales with
    // the mass ratio. That is the compiler's own assumption, not a measured fact, and the row that
    // names the revision's second bake is where the two can be compared: at 0.30 the scaling says
    // one number and the bake says another, and the difference is the size of the approximation.
    var ratio = (r.massBefore && r.massBefore > 0) ? mass / r.massBefore : 1;
    var tr = torqueRefs;
    if (tr) {
      tr.poses.forEach(function(p){
        p.value.textContent = fixed(p.pose.compiled * ratio, 3) + " / " +
          fixed(p.pose.published, 3);
      });
      tr.cap.textContent = ratio === 1
        ? "compiled / published · N·m"
        : "compiled × mass ratio / published · N·m";
      tr.badge.textContent = (tr.trajectory ? "trajectory" : "static poses") +
        (ratio === 1 ? "" : " · scaled");
      tr.draw(ratio);
      var bake = DATA.revision.effortAfter, scaleOfBake = DATA.revision.effortBefore;
      if (bake != null && scaleOfBake != null && ratio !== 1) {
        tr.effort.style.display = "";
        tr.effort.querySelector(".v").textContent =
          fixed(bake, 3) + " baked / " + fixed(scaleOfBake * ratio, 3) + " scaled";
      } else {
        tr.effort.style.display = "none";
      }
    }
  }
  revBefore.addEventListener("click", function(){ setInfill(DATA.revision.before); });
  revAfter.addEventListener("click", function(){ setInfill(DATA.revision.after); });
  el("revdelta").title = "printed mass change between the two bakes, as a percentage of the first";
  setInfill(DATA.masses.infill);


  // ---------------------------------------------------------------------------------------------
  // drawer: every long sentence lives here, so no card has to scroll to hold one
  // ---------------------------------------------------------------------------------------------
  var entries = {};
  function entry(key, sub, build){ entries[key] = { sub: sub, build: build }; }
  entry("masses", "01 · mass and its assumptions", function(){
    return {
      kvs: [
        ["solid", fixed(DATA.masses.solid,3) + " kg (" + DATA.masses.solidKind + ")"],
        ["print", fixed(DATA.masses.print,3) + " kg (" + DATA.masses.printKind + ")"],
        ["published", fixed(DATA.masses.published,3) + " kg (" + DATA.masses.publishedKind + ")"],
        ["delta, print vs published", "+" + fixed(DATA.masses.deltaPercent,1) + " %"],
        ["infill saving", fixed(DATA.masses.infillSaving,0) + " % of solid"],
        ["assumptions", fixed(DATA.masses.wall,2) + " mm wall, " + fixed(DATA.masses.infill,2) +
          " infill, " + fixed(DATA.masses.density,0) + " kg/m³, servo " + fixed(DATA.masses.servoG,0) + " g"]
      ],
      paras: [
        "The print figure is a model with stated assumptions, not a measurement. The solid figure is " +
        "the CAD volume at the assumed density, so it is the upper bound a print can approach and " +
        "never exceed.",
        DATA.bodies.filter(function(b){ return b.assumed; }).length + " of " + DATA.bodies.length +
        " links rest on an assumed density; servos use datasheet mass through their CAD envelope."
      ]
    };
  });
  entry("torque", "02 · what the mass difference does to the motors", function(){
    var paras = [];
    paras.push(DATA.torque.dynamicComparable
      ? "Same joint-space trajectory on both models, inverse dynamics with contacts disabled."
      : "Static inverse dynamics at matched poses, contacts and limits disabled. A moving-arm " +
        "comparison is not one: " + DATA.torque.dynamicReason + ".");
    var first = DATA.torque.poses[0];
    if (first && DATA.revision.effortBefore != null) {
      paras.push(fixed(DATA.revision.effortBefore,3) + " N·m is the effort check's demand at its " +
        "sampled poses; " + fixed(first.compiled,3) + " N·m is the static load at the resting pose. " +
        "Same joint, two measurements: a load case and a pose.");
    }
    paras.push("Stall " + fixed(DATA.torque.stall,2) + " N·m and rated " + fixed(DATA.torque.rated,2) +
      " N·m are datasheet figures, each named for what it is. Calling stall \"rated\" overstated " +
      "headroom three times over.");
    if (DATA.torque.poseGate != null) {
      paras.push("The pose gate is " + fixed(DATA.torque.poseGate,2) + " mm, the jaw frame " +
        "difference at the worst of " + DATA.torque.poseSamples.length + " sampled poses (" +
        DATA.torque.poseSamples.map(function(v){ return Number(v).toFixed(2); }).join(", ") +
        " mm). A constant offset cannot map a joint vector to a matching tip, so the moving-arm " +
        "curves are not comparable and the card shows static rows.");
    }
    if (DATA.torque.basis) paras.push("Basis: " + DATA.torque.basis);
    return { paras: paras };
  });
  entry("joints", "03 · joint angles during the baked replay", function(){
    return { paras: [
      "Each row is one hinge, its current angle from the baked MuJoCo replay, and a marker for where " +
      "that angle sits inside the adopted limit range.",
      "Limits are adopted from the SO-ARM100 URDF, not measured on a robot. Provenance is in the " +
      "bundle's robot.joints.yaml."
    ]};
  });
  entry("checks", "04 · the seven checks and what each measured", function(){
    var paras = DATA.checks.filter(function(c){ return c.explanation; })
      .map(function(c){ return c.id + ": " + c.explanation; });
    var sc = DATA.selfCollision;
    if (sc.deepestMm != null) {
      paras.push("Self-collision: convex hulls of " + sc.hulls.join(", ") + " overlap by " +
        sc.deepestMm.toFixed(1) + " mm at rest, while the B-rep solids " +
        (sc.solidMm3 == null ? "were not intersected"
         : "intersect by only " + sc.solidMm3.toFixed(2) + " mm³, which is contact scale, not a joint") +
        ". MuJoCo will act on a contact the CAD does not have.");
    }
    return { kvs: DATA.checks.map(function(c){ return [c.id, c.status]; }), paras: paras };
  });
  entry("links", "06 · per-link mass, from the compiled report", function(){
    return {
      kvs: DATA.bodies.map(function(b){
        return [b.name, fixed(b.mass,4) + " kg" + (b.assumed ? " · assumed" : "") +
          (b.hulls != null ? " · " + b.hulls + " hulls" : "")];
      }),
      paras: ["Clicking a link isolates it in the 3D view. Masses come from the compiled report, not " +
        "from the published model the meshes came from."]
    };
  });
  entry("display", "07 · what the toggles do", function(){
    return { paras: [
      "LABELS shows the self-collision callout anchored on the wrist. EXPLODED offsets each link " +
      "along its parent-to-child direction. TURNTABLE orbits slowly until someone touches the view. " +
      "CoM draws one marker per body origin. SELF-COLLISION tints the two bodies whose hulls overlap.",
      "Two toggles from the review are not here: collision HULLS and an OFFICIAL GHOST. The package " +
      "carries visual meshes only, no hull meshes and no published-model meshes, so either control " +
      "would be a button with nothing behind it. The numbers for both are in the cards and this " +
      "drawer; the geometry is not in this bundle."
    ]};
  });
  entry("twin", "08 · calibration, and the data it would need", function(){
    var kvs = [["signal to noise", fixed(DATA.twin.snr.value,2) + " · " + DATA.twin.snr.label]];
    if (DATA.twin.snr.scenario) kvs.push(["scenario", DATA.twin.snr.scenario]);
    if (DATA.twin.coulomb) {
      kvs.push(["Coulomb, " + DATA.twin.coulomb.joint,
        fixed(DATA.twin.coulomb.recovered,3) + " recovered vs " +
        fixed(DATA.twin.coulomb.truth,3) + " planted"]);
    }
    kvs.push(["rungs recovered", (DATA.twin.rungsRecovered != null ? DATA.twin.rungsRecovered : "?") +
      " of " + (DATA.twin.rungsTotal != null ? DATA.twin.rungsTotal : "?")]);
    if (DATA.twin.rmseBefore != null) {
      kvs.push(["preview RMSE", fixed(DATA.twin.rmseBefore,0) + " -> " +
        fixed(DATA.twin.rmseAfter,0) + " mrad"]);
    }
    return { kvs: kvs, paras: [
      "SYNTHETIC method validation. Parameters are planted in a simulation and recovered from " +
      "simulated logs. No hardware was measured.",
      "One signal-to-noise definition on this page: friction torque at the reference joint speed of " +
      "1.9 rad/s divided by the torque error of one 12-bit encoder count. The ratio is speed " +
      "dependent, so the speed is named wherever the ratio is quoted. This bundle's stored rung-3 " +
      "sentence predates that definition and divided by one log's own peak speed; the card quotes " +
      "the scenario table's number instead, and docs/twin/so101/identifiability.md carries the whole " +
      "argument.",
      "A blocked rung is the answer, not a failure: no estimator recovers a parameter buried ten " +
      "times under noise."
    ]};
  });
  entry("same", "09 · the compiled model against the published SO-ARM100 URDF", function(){
    var C = R.comparison || {};
    var rows = (C.bodies || []).map(function(b){
      return [b.ours + " ↔ " + b.theirs, fixed(num(b.ours_kg), 3) + " vs " +
        fixed(num(b.theirs_kg), 3) + " kg"];
    });
    var joints = (C.joints || []).map(function(j){
      return [j.ours + " → " + j.theirs, fixed(Number(j.axis_angle_deg), 2) + "° axis"];
    });
    return { kvs: rows.concat(joints), paras: [
      "The reference is " + (C.theirs || "the published URDF") + ". Both masses are what each " +
      "side states for the same seven links; the difference is the printed-mass model, not a " +
      "different robot.",
      "Axis agreement is the angle between this model's joint axis and the reference's, after the " +
      "zero-pose conventions are applied. Origins are compared at five joint origins over 100 poses " +
      "from a seeded generator."
    ]};
  });
  entry("prov", "04 · where every figure on this page came from", function(){
    return { kvs: [
      ["compiled from", DATA.source || "not in the bundle"],
      ["report generated", String(R.generated_at || "not in the bundle")],
      ["bundle name", M.name || DATA.name || "not in the bundle"],
      ["package tag", DATA.tag || "no tag recorded in this copy"],
      ["replay source", META.source || "not in the bundle"],
      ["calibration", DATA.twin.synthetic ? "SYNTHETIC (simulated logs)" : "measured logs"]
    ], paras: [
      "Every number on this page is read from a file in this package at load time: report.js, " +
      "torque.js, comparison.json, identification.js and manifest.js. None is typed into the page.",
      DATA.tag
        ? "This copy names package tag " + DATA.tag + " in its manifest, and the packager's verifier " +
          "proves that tag's committed zip is these bytes."
        : "This copy's manifest records no package tag, so the header says so rather than naming a " +
          "tag nobody could fetch."
    ]};
  });
  entry("checks_kpi", "header · checks, mass, axis and origin agreement, package", function(){
    return {
      kvs: [
        ["axis RMS", fixed(DATA.residuals.axisRms,2) + "°"],
        ["axis worst", fixed(DATA.residuals.axisWorst,2) + "°"],
        ["origin median", fixed(DATA.residuals.originMedian,2) + " mm"],
        ["origin p90", fixed(DATA.residuals.originP90,2) + " mm"],
        ["origin max", fixed(DATA.residuals.originMax,2) + " mm"],
        ["origin before conventions", fixed(DATA.residuals.originNoConv,2) + " mm"],
        ["link length", fixed(DATA.residuals.linkLength,2) + " mm"]
      ],
      paras: [
        "Residuals compare the compiled chain against the published SO-ARM100 URDF after the " +
        "zero-pose conventions are applied. Without them the joint origins look " +
        fixed(DATA.residuals.originNoConv,0) + " mm apart; with them, " +
        fixed(DATA.residuals.originMedian,2) + " mm median and " +
        fixed(DATA.residuals.originMax,2) + " mm worst.",
        DATA.tag
          ? "Package: manifest.json records tag " + DATA.tag + "."
          : "Package: manifest.json records no tag for this bundle, so the tile says so rather than " +
            "naming one. The package digest is verified at start-up by the voice shell, not by this page."
      ]
    };
  });
  entry("timeline", "footer · replay and the two bakes", function(){
    var r = DATA.revision;
    var paras = [];
    if (DATA.torque.poseGate != null) {
      paras.push("The amber tick at the end of the scrubber marks the worst pose-gate sample, " +
        fixed(DATA.torque.poseGate,2) + " mm. The samples are poses, not frames of this replay, so " +
        "the tick sits at the end of the bar rather than pretending to map onto a frame.");
    }
    paras.push("The infill switch swaps the two bakes: printed mass, and the effort demand the " +
      "revision moved. Nothing else on the page changes.");
    return {
      kvs: [
        ["infill", fixed(r.before,2) + " -> " + fixed(r.after,2)],
        ["printed mass", fixed(r.massBefore,3) + " -> " + fixed(r.massAfter,3) + " kg"],
        ["delta", "+" + fixed(r.deltaPercent,1) + " %"],
        ["links changed", r.linksChanged != null ? r.linksChanged : "not in the bundle"],
        ["effort", fixed(r.effortBefore,3) + " -> " + fixed(r.effortAfter,3) + " N·m"]
      ],
      paras: paras
    };
  });

  var drawer = el("drawer"), scrim = el("scrim"), lastFocus = null;
  function openDrawer(key){
    var e = entries[key]; if (!e) return;
    el("dtitle").textContent = e.sub.split(" · ")[1] || e.sub;
    el("dsub").textContent = e.sub;
    var body = el("dbody"); body.textContent = "";
    var built = e.build();
    (built.kvs || []).forEach(function(pair){
      var p = mk("div","kv");
      p.appendChild(mk("b", null, pair[0] + ": "));
      p.appendChild(document.createTextNode(pair[1]));
      body.appendChild(p);
    });
    (built.paras || []).forEach(function(t){ body.appendChild(mk("p", null, t)); });
    drawer.classList.add("open"); scrim.classList.add("on");
    drawer.setAttribute("aria-hidden","false");
    lastFocus = document.activeElement;
    el("dclose").focus();
  }
  function closeDrawer(){
    drawer.classList.remove("open"); scrim.classList.remove("on");
    drawer.setAttribute("aria-hidden","true");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  Array.prototype.forEach.call(document.querySelectorAll("button.i"), function(b){
    b.addEventListener("click", function(){ openDrawer(b.dataset.drawer); });
  });
  el("dclose").addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);
  addEventListener("keydown", function(e){ if (e.key === "Escape") closeDrawer(); });

  // ---------------------------------------------------------------------------------------------
  // voice contract: sections.js flashes the element a section maps to and dispatches
  // `robocad:section`. In presenter mode the matching drawer entry opens too, so "show me the
  // checks" lands on the paragraph as well as the card.
  // ---------------------------------------------------------------------------------------------
  var presenterMode = /(?:^|[?&])presenter(?:=1|=true|&|$)/.test(location.search || "");
  var drawerFor = { overview: "checks_kpi", comparison: "checks_kpi", masses: "masses",
                    checks: "checks", torque: "torque", revision: "timeline", twin: "twin" };
  document.addEventListener("robocad:section", function(ev){
    if (!presenterMode) return;
    var section = ev && ev.detail ? ev.detail.section : null;
    if (section && drawerFor[section]) openDrawer(drawerFor[section]);
  });

  // hook the film recorder and the verifier drive: frames deterministic, state inspectable
  // Debug handles the page's own geometry tests read: the body names and the body groups whose
  // matrices the callout anchors against. They are read-only views, not controls.
  window.__pageBodies = BODIES;
  window.__pageGroups = bodyGroups;
  window.SO101_PAGE = {
    data: DATA,
    setFrame: function(f){
      frame = ((f % frames) + frames) % frames;
      applyFrame(frame);
      renderer.render(scene, camera);
    },
    frames: frames, hz: META.hz || 100, meta: META, presenter: presenterMode,
    pause: function(){
      playing = false;
      var b = el("b-play"); b.textContent = "play"; b.setAttribute("aria-pressed","false");
    },
    openDrawer: openDrawer, closeDrawer: closeDrawer, setInfill: setInfill,
    triangulate: function(){ return triTotal; },
    state: state,
    meshWorldSample: function(geomIndex){
      var m = null;
      scene.traverse(function(o){ if (o.isMesh && o.userData.geomIndex === geomIndex) m = o; });
      if (!m) return null;
      m.updateWorldMatrix(true, false);
      var v = new THREE.Vector3().fromBufferAttribute(m.geometry.attributes.position, 0);
      return v.applyMatrix4(m.matrixWorld).toArray();
    },
    fps: function(){
      return new Promise(function(res){
        var n = 0, start = performance.now();
        function tick(){
          n++;
          if (performance.now() - start < 1000) requestAnimationFrame(tick); else res(n);
        }
        requestAnimationFrame(tick);
      });
    }
  };

  if (window.ROBOCAD_SECTIONS) window.ROBOCAD_SECTIONS.wire();
})();
</script>
</body>
</html>
