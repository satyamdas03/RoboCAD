    <!--
      DIRECTION CONTRACT — RoboCAD main app surface
      THESIS: A precision engineering workstation for turning language into editable, manufacturable robot parts. The 3D model is the hero, controls are instrument-grade, and every state is readable at a glance in a dark laboratory environment.
      OWN-WORLD: Near-black ground (#121315), obsidian panels (#1b1c1e / #1f2022), surgical cyan accent (#00e5ff), tactical amber for warnings (#feb300), Inter for UI, JetBrains Mono for data, tight 4px grid, machined 4px corners, inset fields, LED glow indicators.
      STORY: User describes a part → sees status build like a CNC control booting → model appears in a large central viewport → parameters and manufacturing data sit in readout panels → export or send to Onshape in one click.
      FIRST VIEWPORT: Fixed instrument header with RoboCAD mark + search + backend status. Left sidebar: component library and history. Center: prompt composer, status, 3D viewer, parameter inspector, bottom grid of manufacturing / Onshape / tags / remix. Right inspector: metadata, validation, selected face, quick export.
      FORM: Precision engineering workstation / desktop industrial tool, dark-first, dense information display.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and every shipping decision recorded.
    -->
